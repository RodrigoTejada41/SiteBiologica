server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    include /etc/nginx/snippets/csp.conf;

    location /_assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }

    # Preserva autoridade e favoritos das URLs do site anterior.
    location = /index.html {
        if ($request_uri = /index.html) { return 301 /; }
        try_files /index.html =404;
    }
    location = /servicos.html { return 301 /servicos/; }
    location = /clientes.html { return 301 /clientes/; }
    location = /contato.html { return 301 /contato/; }

    # Endpoints antigos que não devem continuar públicos.
    location = /noindex.html { return 410; }
    location = /php/style.php { return 410; }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
